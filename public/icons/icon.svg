<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square: platforms apply their own corner mask. Mark sits inside the 80% maskable safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <clipPath id="glass"><circle cx="20" cy="22.5" r="5.4"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1" flood-color="#0B1F4D" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(8.6) translate(-20 -20)">
    <rect x="8.5" y="6" width="23" height="28" rx="5.5" fill="url(#body)" filter="url(#shadow)"/>
    <rect x="8.5" y="14.2" width="23" height="0.6" fill="#DBEAFE"/>
    <circle cx="13.2" cy="10.2" r="1.5" fill="#2563EB"/>
    <circle cx="17.6" cy="10.2" r="1.5" fill="#93C5FD"/>
    <rect x="22.2" y="9.3" width="5.6" height="1.8" rx="0.9" fill="#BFDBFE"/>
    <circle cx="20" cy="23.5" r="7.4" fill="#2563EB"/>
    <g transform="translate(0 1)">
      <circle cx="20" cy="22.5" r="5.4" fill="#DBEAFE"/>
      <path clip-path="url(#glass)" fill="#60A5FA" d="M13 23.2q1.75-1.8 3.5 0t3.5 0 3.5 0 3.5 0V30H13z"/>
      <circle cx="18" cy="25.6" r="0.75" fill="#fff" opacity="0.9"/>
      <circle cx="21.6" cy="26.6" r="0.5" fill="#fff" opacity="0.9"/>
      <path d="M16.6 20.6a4 4 0 0 1 2.4-2" stroke="#fff" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
